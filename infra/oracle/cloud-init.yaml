#cloud-config
# Preparacao automatica do servidor no primeiro boot da instancia Oracle ARM
# (VM.Standard.A1.Flex, a maquina maior do Always Free).
#
# Para a instancia Micro (1 GB), use cloud-init-micro.yaml.
#
# ATENCAO AO EDITAR: este arquivo tem de ficar em ASCII puro, sem acentos.
# O painel da Oracle nao preserva a codificacao no upload, e um unico caractere
# acentuado faz o cloud-init descartar o arquivo INTEIRO em silencio - a
# instancia sobe limpa e voce so descobre depois, procurando o que nao rodou.
# O erro fica em /var/log/cloud-init.log como "Failed loading yaml blob".
#
# O trabalho de verdade fica no script bash abaixo, nao em "runcmd", porque
# o cloud-init executa runcmd com /bin/sh (dash), que nao entende sintaxe de
# bash como "exec > >(tee ...)".
#
# Como usar: em "Initialization script", escolha "Choose cloud-init script
# file" e envie este arquivo.
#
# Depois de criar a instancia, confira com:
#   cloud-init status --wait
#   cat /var/log/erpsitio-preparacao.log

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - ca-certificates
  - gnupg

write_files:
  # Evita que a instalacao do iptables-persistent trave perguntando se deve
  # salvar as regras atuais.
  - path: /etc/erpsitio-preseed.conf
    content: |
      iptables-persistent iptables-persistent/autosave_v4 boolean true
      iptables-persistent iptables-persistent/autosave_v6 boolean true

  - path: /opt/erpsitio-preparar.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/erpsitio-preparacao.log) 2>&1

      echo "=== preparando servidor para o ERPSitio ==="

      echo "[1/4] instalando Docker..."
      curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
      sh /tmp/get-docker.sh
      usermod -aG docker ubuntu
      systemctl enable --now docker

      echo "[2/4] liberando portas 80 e 443 no firewall do sistema..."
      # Segunda camada de firewall. A primeira (Security List) fica no painel
      # da Oracle e precisa ser liberada la tambem.
      debconf-set-selections /etc/erpsitio-preseed.conf
      DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent
      # A posicao da regra de bloqueio (REJECT/DROP) muda de maquina para
      # maquina - ja foi vista na 5 e na 6. Numero fixo funciona so por sorte:
      # se o bloqueio estiver antes da posicao escolhida, a porta liberada
      # aqui nunca e alcancada, e ainda assim aparece "certa" no iptables -L.
      liberar_porta() {
        local porta="$1"
        local linha_bloqueio
        linha_bloqueio=$(iptables -L INPUT -n --line-numbers | awk '$2=="REJECT"||$2=="DROP"{print $1; exit}')
        if [ -n "$linha_bloqueio" ]; then
          iptables -I INPUT "$linha_bloqueio" -m state --state NEW -p tcp --dport "$porta" -j ACCEPT
        else
          iptables -A INPUT -m state --state NEW -p tcp --dport "$porta" -j ACCEPT
        fi
      }
      liberar_porta 80
      liberar_porta 443
      netfilter-persistent save

      echo "[3/4] criando swap de 2 GB..."
      if [ ! -f /swapfile ]; then
        fallocate -l 2G /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      echo "[4/4] instalando rclone e baixando o sistema..."
      curl -fsSL https://rclone.org/install.sh | bash
      if [ ! -d /home/ubuntu/ERPSitio ]; then
        git clone https://github.com/AgroConsultoriaCM/ERPSitio.git /home/ubuntu/ERPSitio
      fi
      chown -R ubuntu:ubuntu /home/ubuntu/ERPSitio
      chmod +x /home/ubuntu/ERPSitio/infra/scripts/*.sh

      echo "=== servidor pronto ==="
      echo "Falta liberar as portas 80/443 no painel da Oracle (Security List)"
      echo "e configurar o .env antes de subir o sistema."

runcmd:
  - [bash, /opt/erpsitio-preparar.sh]

final_message: "ERPSitio: servidor preparado em $UPTIME segundos. Veja /var/log/erpsitio-preparacao.log"
