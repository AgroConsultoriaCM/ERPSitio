# Produção dividida: só a API e o banco moram aqui.
#
# O frontend está na Vercel, que compila e distribui o PWA. Esta máquina é a
# Oracle VM.Standard.E2.1.Micro do Always Free: 1 GB de RAM e 1/8 de OCPU.
# Tudo aqui é dimensionado para caber nisso.
#
# Uso, na raiz do repo:
#   docker compose -f infra/docker-compose.micro.yml --env-file .env up -d
#
# Diferença para o docker-compose.vps.yml: não existe o serviço "web" (nginx
# servindo o site) — a Vercel faz esse papel. Sobram RAM e CPU para o Postgres.
name: erpsitio

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # O padrão do Postgres assume um servidor bem maior. Sem estes ajustes ele
    # reserva memória que a máquina não tem e o kernel mata o processo (OOM)
    # justamente sob carga. max_connections baixo é proposital: cada conexão
    # custa memória, e a API usa um punhado.
    command: >
      postgres
      -c max_connections=20
      -c shared_buffers=96MB
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=4MB
    mem_limit: 320m
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    # Imagem publicada pelo GitHub Actions (.github/workflows/imagem-api.yml).
    # Compilar aqui dentro levaria dezenas de minutos em 1/8 de OCPU; o
    # Actions compila de graça e esta máquina só baixa o resultado pronto.
    image: ${IMAGEM_API:-ghcr.io/agroconsultoriacm/erpsitio-api:main}
    restart: unless-stopped
    command: sh -c "node_modules/.bin/prisma migrate deploy --schema packages/db/prisma/schema.prisma && node apps/api/dist/server.js"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: 3333
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: ${JWT_REFRESH_EXPIRES_IN_DAYS:-30}
      # Agora site e API vivem em origens diferentes: só quem estiver nesta
      # lista consegue falar com a API pelo navegador.
      CORS_ORIGIN: ${CORS_ORIGIN}
      # Credenciais da API Agrofit (Embrapa). Vazias por padrão: sem elas a
      # consulta ao cadastro do MAPA fica indisponível, e o resto roda igual.
      AGROFIT_CONSUMER_KEY: ${AGROFIT_CONSUMER_KEY:-}
      AGROFIT_CONSUMER_SECRET: ${AGROFIT_CONSUMER_SECRET:-}
      # Teto de heap abaixo do mem_limit: o Node precisa saber que tem pouco,
      # ou só descobre quando o container já morreu.
      NODE_OPTIONS: --max-old-space-size=256
    mem_limit: 320m
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO_API: ${DOMINIO_API}
      EMAIL_TLS: ${EMAIL_TLS}
    mem_limit: 64m
    volumes:
      - ./caddy/Caddyfile.api:/etc/caddy/Caddyfile:ro
      # certificados persistidos: sem isso, cada restart pede um novo ao
      # Let's Encrypt e a cota semanal estoura
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
  caddy_logs:
