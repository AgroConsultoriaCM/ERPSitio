# Ambiente de DESENVOLVIMENTO: hot-reload, node_modules em volume nomeado
# (evita conflito entre node_modules do host e do container).
# Uso (na raiz do repo): docker compose -f infra/docker-compose.yml --env-file .env up
name: erpsitio-dev

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ../:/repo
      - api_node_modules:/repo/node_modules
    # Observacao: "migrate" roda "prisma migrate deploy", que so aplica
    # migrations ja existentes em packages/db/prisma/migrations. Na primeira
    # vez que o projeto for configurado, gere a migration inicial uma vez
    # (veja o README, secao "Primeira configuracao") antes de subir este
    # servico normalmente.
    #
    # "apk add openssl" primeiro: o motor do Prisma precisa de libssl, e
    # node:20-alpine nao vem com ela - sem isso "migrate deploy" falha com
    # "Could not parse schema engine response" (a mensagem real, sobre
    # OpenSSL, fica escondida antes dela).
    command: sh -c "apk add --no-cache openssl && npm install && npm run generate --workspace packages/db && npm run migrate --workspace packages/db && (npm run seed --workspace packages/db || true) && npm run dev --workspace apps/api"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_PORT: ${API_PORT:-3333}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN_DAYS: 30
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_SENHA: ${SEED_ADMIN_SENHA}
      # Integrações externas opcionais - sem elas o sistema sobe igual, só o
      # recurso correspondente fica indisponível (ver env.ts).
      AGROFIT_CONSUMER_KEY: ${AGROFIT_CONSUMER_KEY}
      AGROFIT_CONSUMER_SECRET: ${AGROFIT_CONSUMER_SECRET}
      COPERNICUS_CLIENT_ID: ${COPERNICUS_CLIENT_ID}
      COPERNICUS_CLIENT_SECRET: ${COPERNICUS_CLIENT_SECRET}
      OCR_SPACE_API_KEY: ${OCR_SPACE_API_KEY}
    ports:
      - "${API_PORT:-3333}:3333"
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:20-alpine
    working_dir: /repo
    volumes:
      - ../:/repo
      - web_node_modules:/repo/node_modules
    command: sh -c "npm install && npm run dev --workspace apps/web -- --host"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3333/api/v1}
    ports:
      - "${WEB_PORT:-5173}:5173"
    depends_on:
      - api

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
