# Compila a imagem da API e publica no GitHub Container Registry.
#
# Motivo: a máquina do Always Free tem 1/8 de OCPU. Compilar TypeScript e
# instalar dependências lá dentro levaria dezenas de minutos a cada
# atualização. Aqui a compilação é gratuita e a máquina só baixa o resultado.
#
# Depois que este workflow roda, atualizar o sistema no servidor é:
#   docker compose -f infra/docker-compose.micro.yml --env-file .env pull
#   docker compose -f infra/docker-compose.micro.yml --env-file .env up -d

name: Imagem da API

on:
  push:
    branches: [main]
    # Mexer só no frontend não precisa gerar imagem nova da API.
    paths:
      - "apps/api/**"
      - "packages/db/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "infra/certs/**"
      - ".github/workflows/imagem-api.yml"
  workflow_dispatch:

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Entrar no registro do GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Token que o próprio Actions fornece: não precisa criar segredo.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Definir nome e etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          # O GHCR exige tudo minúsculo; esta ação já normaliza o nome do dono.
          images: ghcr.io/${{ github.repository_owner }}/erpsitio-api
          tags: |
            type=ref,event=branch
            type=sha,format=short

      - name: Compilar e publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          # Só amd64 por enquanto: é o que a VM.Standard.E2.1.Micro usa.
          # Quando a instância ARM liberar, acrescentar linux/arm64 aqui
          # (compila por emulação, fica mais lento, mas funciona).
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
